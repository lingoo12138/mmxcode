{{define "content"}}
<div class="page-head">
  <p class="lead">拿一个 mcode 账号登进网关。登进来的账号就是网关后面站着的人。</p>
</div>

{{if .Pending}}
<div class="notice">
  <h2>还差一步</h2>
  <p>把验证码 <strong>{{.Pending.UserCode}}</strong> 填到
     <a href="{{.Pending.URL}}" target="_blank" rel="noopener">这个页面</a>。</p>
</div>
{{else}}
<div class="toolbar">
  <button id="start-login" type="button" class="primary icon">
    <svg class="ic ic-sm" aria-hidden="true"><use href="/static/icons.svg#login"/></svg><span>开始登录</span></button>
  <span class="muted">浏览器会给你一个验证码，填到站点上就成了。</span>
</div>
{{end}}
{{/* 验证码和结果各有一个地方：页面一开始没有等待中的登录时，
     失败的话也得让人看见那句话。 */}}
<div id="login-result" class="notice" role="status"></div>
<p id="poll-result" class="note" role="status">{{if .Pending}}正在等……{{end}}</p>
{{end}}
