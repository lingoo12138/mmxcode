{{define "content"}}
<div class="page-head">
  <p class="lead">签出（signed_out）而且还存着密码的账号，可以拿密码重新登一遍。</p>
  <div class="page-actions">
    <span class="muted" id="relogin-status"></span>
    <button id="relogin-all" type="button" class="primary icon">
      <svg class="ic ic-sm"><use href="/static/icons.svg#refresh"/></svg><span>全部重登</span></button>
  </div>
</div>

<div class="table-wrap">
<table>
  <thead><tr><th>账号</th><th>邮箱</th><th>上次为什么掉的</th></tr></thead>
  <tbody>
    {{range .SignedOut}}
    <tr>
      <td class="nowrap">{{.Name}}</td>
      <td>{{.Email}}</td>
      <td class="err">{{.Error}}</td>
    </tr>
    {{end}}
    {{if not .SignedOut}}<tr><td class="empty" colspan="3">没有签出去的账号。</td></tr>{{end}}
  </tbody>
</table>
</div>
{{end}}
