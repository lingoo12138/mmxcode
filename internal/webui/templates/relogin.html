{{define "content"}}
<div class="page-head">
  <p class="lead">签出（signed_out）而且还存着密码的账号，可以拿密码重新登一遍。</p>
  <div class="page-actions">
    <span class="muted" id="relogin-status" role="status"></span>
    <button id="relogin-all" type="button" class="primary icon"{{if not .SignedOut}} disabled{{end}}>
      <svg class="ic ic-sm" aria-hidden="true"><use href="/static/icons.svg#refresh"/></svg><span>全部重登</span></button>
  </div>
</div>

<div class="table-wrap">
<table>
  <caption class="sr-only">签出去的账号，和它们掉线的原因</caption>
  <thead><tr><th scope="col">账号</th><th scope="col">邮箱</th><th scope="col">上次为什么掉的</th></tr></thead>
  <tbody>
    {{range .SignedOut}}
    <tr>
      <td class="nowrap">{{.Name}}</td>
      <td>{{.Email}}</td>
      <td><div class="err">{{.Error}}</div></td>
    </tr>
    {{end}}
    {{if not .SignedOut}}<tr><td class="empty" colspan="3">没有签出去的账号。掉线还存着密码的账号会出现在这儿。</td></tr>{{end}}
  </tbody>
</table>
</div>
{{end}}
