{{define "layout"}}<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>{{.Title}} · mmxcode</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<a class="skip" href="#main">跳到正文</a>
<header class="topbar">
  <a class="brand" href="/"><span class="brand-mark">mx</span><span class="brand-name">mmxcode</span></a>
  <nav class="nav">
    <a href="/"{{if eq .Nav "accounts"}} class="is-current"{{end}}>账号</a>
    <a href="/egress"{{if eq .Nav "egress"}} class="is-current"{{end}}>出口</a>
    <a href="/usage"{{if eq .Nav "usage"}} class="is-current"{{end}}>用量</a>
    <a href="/keys"{{if eq .Nav "keys"}} class="is-current"{{end}}>密钥</a>
    <a href="/login"{{if eq .Nav "login"}} class="is-current"{{end}}>登录</a>
    <a href="/import"{{if eq .Nav "import"}} class="is-current"{{end}}>导入</a>
    <a href="/relogin"{{if eq .Nav "relogin"}} class="is-current"{{end}}>重登</a>
  </nav>
  <div class="topbar-end">
    {{if .HasKeys}}<a href="/signin" id="sign-out" class="nav-signout">退出</a>{{end}}
  </div>
</header>
<main class="wrap" id="main">
{{template "content" .}}
</main>
<span class="status" id="status" role="status" aria-live="polite"></span>
<script src="/static/app.js"></script>
{{if .HasKeys}}
<script>
// 退出：把浏览器里那张票删掉，再回到登录页。
// 没有 key 的网关没有这张票，也就不用退出。
document.addEventListener('click', async (ev) => {
  const link = ev.target.closest('#sign-out');
  if (!link) return;
  ev.preventDefault();
  try {
    await fetch('/api/session', { method: 'DELETE' });
  } catch (e) {
    /* 签不出去也就还是那样 */
  }
  location.href = '/signin';
});
</script>
{{end}}
</body>
</html>{{end}}
