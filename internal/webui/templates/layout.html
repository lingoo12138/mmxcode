{{define "layout"}}<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>{{.Title}} · mmxcode</title>
<link rel="stylesheet" href="/static/app.css">
<script>
// 主题得在第一帧之前定下来。等样式表加载完再换，人会看见一帧白闪。
// 所以这一小段放在 head 里，先读本地存的偏好。
(function () {
  try {
    var t = localStorage.getItem('mmxcode-theme');
    if (t === 'light' || t === 'dark') {
      document.documentElement.setAttribute('data-theme', t);
    }
  } catch (e) {
    // 存不下就跟着系统走。
  }
})();
</script>
</head>
<body>
<a class="skip" href="#main">跳到正文</a>
<div class="shell">
  <aside class="side">
    <a class="side-brand" href="/"><span class="brand-mark">mx</span><span class="brand-name">mmxcode</span></a>
    <nav class="side-nav">
      <p class="side-group">看情况</p>
      <a href="/"{{if eq .Nav "overview"}} class="is-current"{{end}}>
        <svg class="ic"><use href="/static/icons.svg#layout-dashboard"/></svg><span>概览</span></a>
      <a href="/accounts"{{if eq .Nav "accounts"}} class="is-current"{{end}}>
        <svg class="ic"><use href="/static/icons.svg#users"/></svg><span>账号</span><span class="side-count">{{.AccountCount}}</span></a>
      <a href="/usage"{{if eq .Nav "usage"}} class="is-current"{{end}}>
        <svg class="ic"><use href="/static/icons.svg#chart-bar"/></svg><span>用量</span></a>
      <a href="/egress"{{if eq .Nav "egress"}} class="is-current"{{end}}>
        <svg class="ic"><use href="/static/icons.svg#world"/></svg><span>出口</span></a>
      <p class="side-group">动手</p>
      <a href="/keys"{{if eq .Nav "keys"}} class="is-current"{{end}}>
        <svg class="ic"><use href="/static/icons.svg#key"/></svg><span>密钥</span></a>
      <a href="/login"{{if eq .Nav "login"}} class="is-current"{{end}}>
        <svg class="ic"><use href="/static/icons.svg#login"/></svg><span>登录</span></a>
      <a href="/import"{{if eq .Nav "import"}} class="is-current"{{end}}>
        <svg class="ic"><use href="/static/icons.svg#upload"/></svg><span>导入</span></a>
      <a href="/relogin"{{if eq .Nav "relogin"}} class="is-current"{{end}}>
        <svg class="ic"><use href="/static/icons.svg#refresh"/></svg><span>重登</span></a>
    </nav>
    <div class="side-foot">
      <div class="row">
        <svg class="ic ic-sm"><use href="/static/icons.svg#plug"/></svg>
        <span>网关在跑</span>
      </div>
    </div>
  </aside>
  <div class="main">
    <header class="topbar">
      <div class="crumb"><h1>{{.Title}}</h1></div>
      <div class="topbar-end">
        <button type="button" id="theme-toggle" class="icon" title="换个深浅" aria-label="换个深浅">
          <svg class="ic" id="theme-icon"><use href="/static/icons.svg#sun-moon"/></svg>
        </button>
        {{if .HasKeys}}<a href="/signin" id="sign-out" class="nav-signout">
          <svg class="ic ic-sm"><use href="/static/icons.svg#logout"/></svg><span>退出</span></a>{{end}}
      </div>
    </header>
    <main class="page" id="main">
{{template "content" .}}
    </main>
  </div>
</div>
<span class="status" id="status" role="status" aria-live="polite"></span>
<script src="/static/app.js"></script>
{{if .HasKeys}}
<script>
// 退出：把浏览器里那张票删掉，再回到登录页。
// 没有 key 的网关没有这张票，也就不用退出。
document.addEventListener('click', async (ev) => {
  const link = ev.target.closest('#sign-out');
  if (!link) return;
  ev.preventDefault();
  try {
    await fetch('/api/session', { method: 'DELETE' });
  } catch (e) {
    /* 签不出去也就还是那样 */
  }
  location.href = '/signin';
});
</script>
{{end}}
</body>
</html>{{end}}
