server:
  listen: ":8080"
  # 这里不写 api_keys：密钥是申请来的，写进镜像就等于把它摊在别人眼前。
  # 密钥从环境变量来（见 docker-compose.yml 里的 MMXCODE_API_KEYS），
  # 或者在部署的时候把它写进挂进去的配置文件。

proxy:
  default: "http://host.docker.internal:7890"
  groups:
    clash:  "http://host.docker.internal:7890"
    warp:   "socks5h://warp:4000"
    direct: "direct"

upstream:
  timeout: 120s
  site: global

rotation:
  strategy: sticky
  max_attempts: 3
  exhausted_cooldown: 5m

schedule:
  checkin_at: "09:00"
  usage_refresh: 15m
  token_refresh: 5m
  egress_health: 2m

batch:
  # 批量导入时每个账号之间的间隔
  interval: 3s
  # 批量导入走哪个出口组（空 = 全局默认出口）
  # 配了这个组，导入的账号就都走这个组：账号自己手填的出口地址会被清掉，
  # 导入结果里会写明清掉的是哪个地址。网页上传也用这个组。
  group: ""
  relogin:
    # 账号掉线了自动用存着的密码登回去（默认关）
    enabled: false
    # 调度器两趟之间隔多久
    cooldown: 1h
    # 一轮最多处理多少个账号
    max_accounts: 20

usage:
  refresh:
    # 一个账号用过之后多久还算热（热账号的额度才值得现读）
    hot_window: 5m
    # 多久扫一遍该读额度的账号
    scan_every: 30s
    # 一趟同时读几个账号的额度
    concurrency: 4
    # 一个账号的额度最多读多久（卡住的账号不拖住整趟）
    timeout: 15s
    # 一趟读额度最多花多久（用完就停，剩下的下一趟接着读）
    budget: 30s
    # 一趟最多读几个账号
    batch: 6
    # 卡片现读读几个账号（卡片等不了）
    card: 2
    # 卡片现读最多花多久
    card_budget: 5s

concurrency:
  # 每个账号同时几个请求
  per_account: 1
  # 总并发是可用账号数的几分之一（5 = 五分之一）
  total_ratio: 5
  # 账号少的时候总并发至少几个
  total_min: 3
  # 总并发的天花板：不管池子里有多少个号、库里有多少个号，承诺的并发都
  # 不超过它。0 = 不限（跟从前一样）。
  #
  # 池空的时候承诺是从库里数出来的 —— 库里 1000 个号就承诺 200，那一下能
  # 从池子撑的数抬到库里的数。天花板是给这一下准备的。池子的大小是按承
  # 诺的并发算的（max(总并发, 活跃会话数) × 倍数），所以天花板定 64，池
  # 子就是 128 个号。
  total_max: 0
  # 请求等一个空位最多等多久（等不到就 429）
  wait: 10s

# 账号池：网关把账号放在内存里的一个池子里，挑号不再每次扫全表。
#
# 池多大 = max(总并发, 活跃会话数) × factor。
#   - factor：倍数。2 = 再留一倍给补号用。
#   - max_size：池里最多几个号。0 = 不限（由别的两个上限说了算）。
#   - memory_budget_mb：池的内存预算（兜底）。一个号按 512 字节算，
#     32MB 装得下 6 万多个号 —— 200–1000 个号的时候这个上限碰不到。
#   - session_window：算「活跃会话数」时看多久以内的会话。1 小时。
#   - read_on_admit：补号时先读一次额度再进池（true = 读不到额度
#     的号不进池）。
pool:
  factor: 2
  max_size: 0
  memory_budget_mb: 32
  session_window: 1h
  read_on_admit: true

db: "/data/mmxcode.db"
