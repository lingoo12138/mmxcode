server:
  listen: ":8080"
  api_keys: ["sk-local-change-me"]

proxy:
  default: "http://host.docker.internal:7890"
  groups:
    clash:  "http://host.docker.internal:7890"
    warp:   "socks5h://warp:4000"
    direct: "direct"

upstream:
  timeout: 120s
  site: global

rotation:
  strategy: sticky
  max_attempts: 3
  exhausted_cooldown: 5m

schedule:
  checkin_at: "09:00"
  usage_refresh: 15m
  token_refresh: 5m
  egress_health: 2m

db: "/data/mmxcode.db"
