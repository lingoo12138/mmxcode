server:
  listen: ":8080"
  # 网关的 key（也是后台登录那把）。不写 = 不鉴权，这时只允许听本机。
  # 也可以用环境变量 MMXCODE_API_KEYS 给（逗号隔开）：密钥是申请来的，
  # 不该躺在文件里。
  api_keys: ["sk-local-xxxx"]

proxy:
  # 全局默认出口。"direct" 表示不走代理。
  # 出口是四级的：账号自己的地址（在网页上每一行都能填），账号指着的组，
  # 全局组（也是一个组，名字是 default），最后是直连。
  #
  # 这里这个地址只是全局组的种子：库里还没有全局组的时候用它建一个。
  # 组在库里之后，网页上改的是库里那份，这个键就不再管事了。
  default: "http://127.0.0.1:7890"

upstream:
  timeout: 120s
  site: global
  # 上游回包最多多大（MiB）。站点自己那个回答上限（524288 个 token）折成
  # 字节是 2 MB 上下，8 MiB 是它上面的三倍多。超了就是上游发的不是回答。
  max_body_mb: 8

rotation:
  strategy: sticky
  max_attempts: 3
  exhausted_cooldown: 5m

schedule:
  # 每天签到的时间，大陆时间（站点按大陆时间算一天）
  checkin_at: "00:00"
  # 签到最多往后推多久（几个实例一起跑的时候抖一下就散开了）
  checkin_jitter: 0s
  usage_refresh: 15m
  token_refresh: 5m
  egress_health: 2m

batch:
  # 批量导入时每个账号之间的间隔
  interval: 3s
  relogin:
    # 账号掉线了自动用存着的密码登回去（默认关）
    enabled: false
    # 调度器两趟之间隔多久
    cooldown: 1h
    # 一轮最多处理多少个账号
    max_accounts: 20

usage:
  refresh:
    # 一个账号用过之后多久还算热（热账号的额度才值得现读）
    hot_window: 5m
    # 多久扫一遍该读额度的账号
    scan_every: 30s
    # 一趟同时读几个账号的额度
    concurrency: 4
    # 一个账号的额度最多读多久（卡住的账号不拖住整趟）
    timeout: 15s
    # 一趟读额度最多花多久（用完就停，剩下的下一趟接着读）
    budget: 30s
    # 一趟最多读几个账号
    batch: 6
    # 卡片现读读几个账号（卡片等不了）
    card: 2
    # 卡片现读最多花多久
    card_budget: 5s
  # 每天的消耗留多少天（折线图看多少天，账本就留多少天）
  #
  # 留得再久也没有人翻，留得再短图上就缺了一块。0 = 永远留着。
  history_days: 30

concurrency:
  # 每个账号同时几个请求
  per_account: 1
  # 总并发是可用账号数的几分之一（5 = 五分之一）
  total_ratio: 5
  # 账号少的时候总并发至少几个
  total_min: 3
  # 总并发的天花板：不管池子里有多少个号、库里有多少个号，承诺的并发都
  # 不超过它。0 = 不限（跟从前一样）。
  #
  # 池空的时候承诺是从库里数出来的 —— 库里 1000 个号就承诺 200，那一下能
  # 从池子撑的数抬到库里的数。天花板是给这一下准备的。池子的大小是按承
  # 诺的并发算的（max(总并发, 活跃会话数) × 倍数），所以天花板定 64，池
  # 子就是 128 个号。
  total_max: 0
  # 请求等一个空位最多等多久（等不到就 429）
  wait: 10s
  # 多大的请求体算大的：超过它一次只让一个进来（图片就那么大的）
  body_small_mb: 4
  # 小请求体同时在飞的字节上限（80 MiB ≈ 19 × 4 MiB）。0 = 不限
  body_budget_mb: 80

# 账号池：网关把账号放在内存里的一个池子里，挑号不再每次扫全表。
#
# 池多大 = max(总并发, 活跃会话数) × factor。
#   - factor：倍数。2 = 再留一倍给补号用。
#   - max_size：池里最多几个号。0 = 不限（由别的两个上限说了算）。
#   - memory_budget_mb：池的内存预算（兜底）。一个号按 512 字节算，
#     32MB 装得下 6 万多个号 —— 200–1000 个号的时候这个上限碰不到。
#   - session_window：算「活跃会话数」时看多久以内的会话。1 小时。
#   - read_on_admit：补号时先读一次额度再进池（true = 读不到额度
#     的号不进池）。
pool:
  factor: 2
  max_size: 0
  memory_budget_mb: 32
  session_window: 1h
  read_on_admit: true

db: "/data/mmxcode.db"

# 库自己怎么干活。
sqlite:
  # 一条连接留多少 MB 的页在工作集里（0 = SQLite 自己的默认，2 MB；负数不许）
  cache_mb: 8
  # 写盘：normal = 交给操作系统（断电可能丢最近几笔），full = 每一笔都
  # fsync（慢一点）
  synchronous: normal
  # 签到的历史留多少天（0 = 永远留；少于 7 天不许 —— 签到的积分七天就过期，
  # 「签到待补」那一档要用的那几天的记录会被清掉）
  checkin_retention_days: 30
