server:
  listen: ":8080"
  api_keys: ["sk-local-xxxx"]

proxy:
  # 全局默认出口。"direct" 表示不走代理。
  default: "http://127.0.0.1:7890"
  # 出口组：账号可以指向其中一组，一组共用一个出口。
  groups:
    clash:  "http://127.0.0.1:7890"
    warp:   "socks5h://warp:4000"
    direct: "direct"

upstream:
  timeout: 120s
  site: global

rotation:
  strategy: sticky
  max_attempts: 3
  exhausted_cooldown: 5m

schedule:
  checkin_at: "09:00"
  usage_refresh: 15m
  token_refresh: 5m
  egress_health: 2m

batch:
  # 批量导入时每个账号之间的间隔
  interval: 3s
  # 批量导入走哪个出口组（空 = 全局默认出口）
  group: ""
  relogin:
    # 账号掉线了自动用存着的密码登回去（默认关）
    enabled: false
    # 调度器两趟之间隔多久
    cooldown: 1h
    # 一轮最多处理多少个账号
    max_accounts: 20

db: "/data/mmxcode.db"
